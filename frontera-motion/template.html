<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frontera Motion</title>
<meta name="viewport" content="width=1440">
<style>
@font-face{font-family:'Inter Tight';src:url(data:font/woff2;base64,__INTERTIGHT__) format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Inter';src:url(data:font/woff2;base64,__INTER__) format('woff2');font-weight:100 900;font-display:block}
:root{
  --canvas:#DFEAFD; --ink:#0A0A0A; --ink2:#363A40; --mute:#737373; --faint:#8B9198;
  --line:#D6E0EF; --line2:#E6ECF5; --fill:#F2F5FA; --accent:#0D6AF3; --accentSoft:#DEEBFE; --dark:#0B0F17;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:1080px;background:var(--canvas);overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum"}
#stage{position:absolute;left:0;top:0;width:1440px;height:1080px;overflow:hidden;background:var(--canvas)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.w{position:absolute;left:0;top:0}
.tt{font-family:'Inter Tight',sans-serif;letter-spacing:-.015em}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#hero{position:absolute;left:0;top:0;overflow:hidden;border:1px solid var(--line);z-index:2}
.layer{position:absolute;left:50%;top:50%}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.ibox{width:32px;height:32px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ibox.dk{background:var(--ink);color:#fff}
.t14{font-size:14px;font-weight:500;line-height:18px}
.t13{font-size:13px;line-height:17px}
.mute{color:var(--mute)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:12px}
.btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.dk{background:var(--ink);color:#fff}
.btn.ol{border:1px solid var(--line);background:#fff;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ol{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.chip.dk{background:var(--ink);color:#fff}
.chip.ac{background:var(--accentSoft);color:var(--accent)}
.abs{position:absolute}

/* fragments */
.frag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;white-space:nowrap;box-shadow:0 1px 2px rgba(16,40,90,.05),0 8px 24px -8px rgba(16,40,90,.12)}
/* cursor */
#cursor{position:absolute;left:0;top:0;z-index:50;transform-origin:3px 2px}
#caps{position:absolute;left:0;top:928px;width:1440px;height:80px;z-index:40}
.cap{position:absolute;left:0;top:0;width:1440px;text-align:center;font-family:'Inter Tight',sans-serif;font-weight:500;font-size:31px;line-height:40px;letter-spacing:-.02em;color:var(--ink)}

/* agent tabs + switcher */
.seg{position:absolute;height:36px;border-radius:10px;background:var(--fill)}
.segInd{position:absolute;top:3px;height:30px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(16,40,90,.10),0 0 0 1px rgba(16,40,90,.05)}
.segT{position:absolute;top:0;height:36px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
#switch{position:absolute;left:0;top:0;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);z-index:3}
#swInd{position:absolute;top:5px;height:32px;border-radius:8px;background:var(--ink)}
.swT{position:absolute;top:0;height:42px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500}

/* workflow */
.node{position:absolute;width:172px;height:64px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 1px 2px rgba(16,40,90,.05)}
.node .ibox{width:30px;height:30px;border-radius:8px}
.node b{display:block;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}
.node span{display:block;font-size:11.5px;line-height:15px;color:var(--mute);white-space:nowrap}
.port{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--ink2)}
.badge{position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.plus{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.elabel{position:absolute;font-size:11px;font-weight:500;color:var(--mute);background:#fff;border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="frags"></div>
    <div id="hero"></div>
    <div id="chip" class="w" style="z-index:4"></div>
    <div id="switch"></div>
    <div id="endWord" class="w tt" style="font-weight:600;font-size:84px;line-height:96px;letter-spacing:-.03em;white-space:nowrap">Frontera</div>
    <div id="endTag" class="w" style="font-size:24px;line-height:32px;color:var(--ink2);white-space:nowrap">Build intelligence into the way work gets done.</div>
  </div>
  <div id="caps"></div>
  <svg id="cursor" width="28" height="32" viewBox="0 0 28 32"><path d="M3 2 L3 24.5 L8.6 19.4 L12.4 28.2 L16.3 26.5 L12.6 17.9 L20.2 17.6 Z" fill="#0A0A0A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
'use strict';
/* ───────── grid ───────── */
const BPM = __BPM__, OFF = __OFF__, BEAT = 60 / BPM, DUR = 24 * 4 * BEAT;
const B = (bar, beat = 1) => OFF + ((bar - 1) * 4 + (beat - 1)) * BEAT;
const MARK = 'data:image/png;base64,__MARK__';
const SCX = 720, SCY = 468;

/* ───────── springs: closed-form step responses ───────── */
function S(dt, w = 14, z = .86) {
  if (dt <= 0) return 0;
  if (z >= 1) { const e = Math.exp(-w * dt); return 1 - e * (1 + w * dt); }
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * dt);
  return 1 - e * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
/* a value that changes target many times = sum of one spring per change */
function track(v0, w = 14, z = .86) {
  const keys = [];
  const f = t => { let v = v0, p = v0; for (const k of keys) { v += (k[1] - p) * S(t - k[0], k[2] || w, k[3] || z); p = k[1]; } return v; };
  f.to = (t, v, kw, kz) => { keys.push([t, v, kw, kz]); return f; };
  f.keys = keys; return f;
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
/* visibility over intervals: enter spring, fast exit */
function V(t, ivs, win = 20, wout = 34) {
  let m = 0;
  for (const [a, b] of ivs) { const e = a == null ? 1 : S(t - a, win, 1), x = b == null ? 0 : S(t - b, wout, 1); m = Math.max(m, e * (1 - x)); }
  return m;
}
function show(el, p, base = '', dy = 0, sc = 0, blur = 7) {
  const s = el.style, b = (1 - p) * blur;
  s.opacity = p.toFixed(4); s.visibility = p < .002 ? 'hidden' : 'visible';
  s.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
  if (base || dy || sc) s.transform = `${base} translateY(${((1 - p) * dy).toFixed(2)}px) scale(${(1 - (1 - p) * sc).toFixed(4)})`;
}
/* press pulse 0→1→0 around a click */
const pulse = (t, tc, hold = .09) => S(t - (tc - .045), 42, 1) - S(t - (tc + hold), 24, .9);
const typed = (t, s, t0, t1) => s.slice(0, Math.floor(clamp((t - t0) / (t1 - t0)) * s.length + 1e-6));

/* ───────── icons (one stroke, 24 grid) ───────── */
const IP = {
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  spark: '<path d="M12 3.5l1.9 5.6 5.6 1.9-5.6 1.9L12 18.5l-1.9-5.6L4.5 11l5.6-1.9z"/>',
  flow: '<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  apps: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>',
  box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  ticket: '<path d="M3 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 11v2M13 17v2"/>',
  cal: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2.5v3M8 2.5v3M3 10h18"/>',
  sheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  hour: '<path d="M6 2.5h12M6 21.5h12M7 2.5v3.7c0 .5.2 1 .6 1.4L12 12l4.4-4.4c.4-.4.6-.9.6-1.4V2.5M7 21.5v-3.7c0-.5.2-1 .6-1.4L12 12l4.4 4.4c.4.4.6.9.6 1.4v3.7"/>',
  zap: '<path d="M13 2 4 14h8l-1 8 9-12h-8z"/>',
  split: '<path d="M16 3h5v5M8 3H3v5M12 22v-8.3a4 4 0 0 0-1.2-2.8L3 3M21 3l-7.8 7.8"/>',
  db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  user: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-1.5A4.5 4.5 0 0 1 6.5 15h5a4.5 4.5 0 0 1 4.5 4.5V21M16 11l2 2 4-4"/>',
  up: '<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>', code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  play: '<path d="M7 4.5v15l12-7.5z"/>', layers: '<path d="M12 2.5 2.5 7.5 12 12.5l9.5-5z"/><path d="m2.5 12 9.5 5 9.5-5M2.5 16.5l9.5 5 9.5-5"/>',
  chev: '<path d="m9 18 6-6-6-6"/>', back: '<path d="m15 18-6-6 6-6"/>', pen: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  upload: '<path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  flag: '<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
};
const ic = (n, s = 16, extra = '') => `<svg class="i" ${extra} width="${s}" height="${s}" viewBox="0 0 24 24">${IP[n]}</svg>`;

/* ───────── DOM ───────── */
const $ = id => document.getElementById(id);
const hero = $('hero');
const LAY = {};
function layer(key, w, h, cx, cy, html, style = '') {
  const d = document.createElement('div');
  d.className = 'layer'; d.id = 'L_' + key;
  d.style.cssText = `width:${w}px;height:${h}px;margin-left:${-w / 2}px;margin-top:${-h / 2}px;${style}`;
  d.innerHTML = html; hero.appendChild(d);
  LAY[key] = { el: d, w, h, cx, cy };
  return d;
}
/* world anchor of an element inside a layer */
function A(id, fx = .5, fy = .5) {
  let el = $(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && !(el.id && el.id.startsWith('L_'))) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  const L = LAY[el.id.slice(2)];
  return [L.cx - L.w / 2 + x + w * fx, L.cy - L.h / 2 + y + h * fy];
}

/* 0 · mark tile (first frame = last frame) */
layer('mark', 120, 120, 0, 0, `<img src="${MARK}" style="position:absolute;left:50%;top:50%;width:56%;transform:translate(-50%,-50%)">`, 'width:100%;height:100%;left:0;top:0;margin:0');

/* 1 · fragments */
const FR = [
  ['file', 'Payout_Policy_v3.pdf', 'Shared in #finance-ops', -430, -255, B(1, 2)],
  ['msg', 'Can someone check yesterday’s payouts?', 'Chat · 4 replies', 330, -300, B(1, 2)],
  ['sheet', 'payouts_0930.xlsx', '1,284 rows · 3 mismatches', -470, 20, B(1, 3)],
  ['mail', 'Re: Vendor invoice mismatch', 'Inbox · Procurement', 430, 40, B(1, 3)],
  ['ticket', '#4821 Delivery delayed', 'Support queue', -310, 290, B(1, 4)],
  ['cal', 'Exception review', 'Today · 14:00', 360, 285, B(1, 4)],
];
$('frags').innerHTML = FR.map((f, i) => `<div class="frag" id="fr${i}"><div class="ibox">${ic(f[0], 16)}</div><div><div class="t14">${f[1]}</div><div class="t13 mute" style="margin-top:2px">${f[2]}</div></div></div>`).join('');

/* 2 · ask bar */
layer('bar', 560, 64, 0, 0, `
  <div class="row" style="position:absolute;left:22px;top:0;height:64px;gap:12px;color:var(--ink)">${ic('search', 20)}
    <span id="barPh" class="tt" style="position:absolute;left:32px;font-size:20px;color:var(--faint);white-space:nowrap">Ask Frontera…</span>
    <span id="barTx" class="tt" style="position:absolute;left:32px;font-size:20px;white-space:nowrap"></span>
    <span id="barCaret" style="position:absolute;top:21px;width:1.5px;height:23px;background:var(--ink)"></span></div>
  <div style="position:absolute;right:16px;top:17px;height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;align-items:center">⌘K</div>`);

/* 3 · platform shell */
const TILES = [
  ['spark', 'Agents', 'Work with a named Agent over time.'],
  ['apps', 'Apps', 'Bring data and AI into one workspace.'],
  ['flow', 'Workflows', 'Connect systems, Agents and people.'],
  ['box', 'Blueprint', 'Objects, relations, shared metrics.'],
];
layer('shell', 1000, 532, 0, 0, `
  <div style="position:absolute;left:0;top:0;right:0;height:52px;border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 20px;gap:10px;font-size:14px">
    <img src="${MARK}" style="width:18px"><b style="font-weight:600">Frontera</b><span class="faint">/</span><span>General</span><span class="faint">/</span><span>Home</span>
    <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
      <div class="row" style="height:32px;width:220px;padding:0 10px;border:1px solid var(--line);border-radius:9px;gap:8px;color:var(--faint);font-size:13px">${ic('search', 15)}Search…<span style="margin-left:auto;font-size:12px">⌘K</span></div>
      <div class="btn ol">${ic('msg', 15)}Ask Frontera</div></div></div>
  <div style="position:absolute;left:32px;top:72px">
    <div class="t13 faint">Workspace: General</div>
    <div class="tt" style="font-size:26px;font-weight:600;line-height:34px;margin-top:2px">Ways to work</div></div>
  ${TILES.map((tl, i) => `
  <div id="shTile${i}" style="position:absolute;left:${32 + (i % 2) * 468}px;top:${150 + Math.floor(i / 2) * 140}px;width:452px;height:124px">
    <div id="shEmpty${i}" style="position:absolute;inset:0;border:1.5px dashed #C3D2EA;border-radius:14px">
      <div id="shPlus${i}" class="plus" style="left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px">${ic('plus', 18)}</div></div>
    <div id="shFull${i}" class="card" style="position:absolute;inset:0;border-radius:14px;padding:20px">
      <div class="ibox" style="width:40px;height:40px;border-radius:11px">${ic(tl[0], 20)}</div>
      <div class="tt" style="position:absolute;left:76px;top:22px;font-size:18px;font-weight:600">${tl[1]}</div>
      <div class="t13 mute" style="position:absolute;left:76px;top:47px">${tl[2]}</div>
      <div id="shCh${i}" class="chip ac" style="position:absolute;left:20px;bottom:16px">${ic('link', 13)}Shared context</div></div>
  </div>`).join('')}
  <div id="shStrip" class="card" style="position:absolute;left:32px;top:432px;width:936px;height:72px;border-radius:14px;background:var(--fill);border-color:var(--line2)">
    <div class="row" style="position:absolute;left:16px;top:16px"><div class="ibox dk" style="width:40px;height:40px;border-radius:11px">${ic('layers', 20)}</div>
      <div><div class="tt" style="font-size:16px;font-weight:600">Shared foundation</div><div class="t13 mute">Blueprint · Knowledge · Connections · Policies</div></div></div>
    <div id="shTog" style="position:absolute;right:18px;top:23px;width:46px;height:26px;border-radius:13px">
      <div id="shKnob" style="position:absolute;top:3px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)"></div></div>
    <div id="shTogL" class="t13" style="position:absolute;right:76px;top:27px;font-weight:500"></div>
  </div>`);

/* 4 · agent */
const AG_TABS = [['Instructions', 112], ['Knowledge', 106], ['Test', 66]];
layer('agent', 760, 540, 0, 0, `
  <div class="row" style="position:absolute;left:24px;top:20px">
    <div class="ibox dk" style="width:40px;height:40px;border-radius:50%">${ic('spark', 19)}</div>
    <div><div class="tt" style="font-size:18px;font-weight:600;line-height:22px">Operations agent</div><div class="t13 mute">Finance Ops · Exception handling</div></div></div>
  <div class="chip ol" style="position:absolute;right:24px;top:27px">${ic('check', 13)}Published</div>
  <div class="seg" style="left:24px;top:80px;width:${AG_TABS.reduce((a, b) => a + b[1], 0) + 6}px">
    <div id="agInd" class="segInd"></div>
    ${AG_TABS.map((tb, i) => `<div id="agT${i}" class="segT" style="left:${3 + AG_TABS.slice(0, i).reduce((a, b) => a + b[1], 0)}px;width:${tb[1]}px">${tb[0]}</div>`).join('')}</div>
  <div style="position:absolute;left:0;right:0;top:131px;border-top:1px solid var(--line2)"></div>
  <div id="agInstr" style="position:absolute;left:24px;top:156px;width:712px">
    <div class="t13 faint">Goal</div>
    <div style="font-size:16px;line-height:24px;margin-top:4px;color:var(--ink2)">Reconcile yesterday’s payouts against the settlement policy and flag exceptions for review.</div>
    <div class="t13 faint" style="margin-top:22px">Authority</div>
    ${[['eye', 'Read', 'Payouts, Records'], ['pen', 'Prepare', 'Exception report'], ['zap', 'Act', 'Ledger update · approval required']].map(r => `
      <div class="row" style="height:48px;border-bottom:1px solid var(--line2)"><div class="ibox">${ic(r[0], 16)}</div><div class="t14" style="width:90px">${r[1]}</div><div class="t13 mute">${r[2]}</div></div>`).join('')}
  </div>
  <div id="agKnow" style="position:absolute;left:24px;top:148px;width:712px;height:380px">
    <div class="row" style="height:28px"><div class="t14">Knowledge</div><div id="agKCount" class="t13 mute"></div></div>
    ${[['Settlement_SOP.docx', 'Indexed · 128 passages'], ['Vendor_Terms_2026.pdf', 'Indexed · 64 passages']].map((r, i) => `

    const w = toScreen(CUR.x(t), CUR.y(t));
    let pr = 0; for (const [a, b] of CUR.PR) pr = Math.max(pr, pulse(t, a, b - a));
    $('cursor').style.transform = `translate(${px(w[0] - 3)},${px(w[1] - 2)}) scale(${(1 - .14 * pr).toFixed(4)})`;
  }
}
window.ready = document.fonts.ready.then(() => { build(); seek(0); window.DUR = DUR; window.seek = seek; return true; });
</script>
</body>
