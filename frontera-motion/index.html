#hero{position:absolute;left:0;top:0;overflow:hidden;border:1px solid var(--line);z-index:2}
.layer{position:absolute;left:50%;top:50%}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.ibox{width:32px;height:32px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ibox.dk{background:var(--ink);color:#fff}
.t14{font-size:14px;font-weight:500;line-height:18px}
.t13{font-size:13px;line-height:17px}
.mute{color:var(--mute)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:12px}
.btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.dk{background:var(--ink);color:#fff}
.btn.ol{border:1px solid var(--line);background:#fff;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ol{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.chip.dk{background:var(--ink);color:#fff}
.chip.ac{background:var(--accentSoft);color:var(--accent)}
.abs{position:absolute}

/* fragments */
.frag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;white-space:nowrap;box-shadow:0 1px 2px rgba(16,40,90,.05),0 8px 24px -8px rgba(16,40,90,.12)}
/* cursor */
#cursor{position:absolute;left:0;top:0;z-index:50;transform-origin:3px 2px}
#caps{position:absolute;left:0;top:928px;width:1440px;height:80px;z-index:40}
.cap{position:absolute;left:0;top:0;width:1440px;text-align:center;font-family:'Inter Tight',sans-serif;font-weight:500;font-size:31px;line-height:40px;letter-spacing:-.02em;color:var(--ink)}

/* agent tabs + switcher */
.seg{position:absolute;height:36px;border-radius:10px;background:var(--fill)}
.segInd{position:absolute;top:3px;height:30px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(16,40,90,.10),0 0 0 1px rgba(16,40,90,.05)}
.segT{position:absolute;top:0;height:36px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
#switch{position:absolute;left:0;top:0;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);z-index:3}
#swInd{position:absolute;top:5px;height:32px;border-radius:8px;background:var(--ink)}
.swT{position:absolute;top:0;height:42px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500}

/* workflow */
.node{position:absolute;width:172px;height:64px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 1px 2px rgba(16,40,90,.05)}
.node .ibox{width:30px;height:30px;border-radius:8px}
.node b{display:block;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}
.node span{display:block;font-size:11.5px;line-height:15px;color:var(--mute);white-space:nowrap}
.port{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--ink2)}
.badge{position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.plus{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.elabel{position:absolute;font-size:11px;font-weight:500;color:var(--mute);background:#fff;border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="frags"></div>
    <div id="hero"></div>
    <div id="chip" class="w" style="z-index:4"></div>
    <div id="switch"></div>
    <div id="endWord" class="w tt" style="font-weight:600;font-size:84px;line-height:96px;letter-spacing:-.03em;white-space:nowrap">Frontera</div>
    <div id="endTag" class="w" style="font-size:24px;line-height:32px;color:var(--ink2);white-space:nowrap">Build intelligence into the way work gets done.</div>
  </div>
  <div id="caps"></div>

</div>

const SCX = 720, SCY = 468;

/* ───────── springs: closed-form step responses ───────── */
function S(dt, w = 14, z = .86) {
  if (dt <= 0) return 0;
  if (z >= 1) { const e = Math.exp(-w * dt); return 1 - e * (1 + w * dt); }
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * dt);
  return 1 - e * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
/* a value that changes target many times = sum of one spring per change */
function track(v0, w = 14, z = .86) {
  const keys = [];
  const f = t => { let v = v0, p = v0; for (const k of keys) { v += (k[1] - p) * S(t - k[0], k[2] || w, k[3] || z); p = k[1]; } return v; };
  f.to = (t, v, kw, kz) => { keys.push([t, v, kw, kz]); return f; };
  f.keys = keys; return f;
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
/* visibility over intervals: enter spring, fast exit */
function V(t, ivs, win = 20, wout = 34) {
  let m = 0;
  for (const [a, b] of ivs) { const e = a == null ? 1 : S(t - a, win, 1), x = b == null ? 0 : S(t - b, wout, 1); m = Math.max(m, e * (1 - x)); }
  return m;
}
function show(el, p, base = '', dy = 0, sc = 0, blur = 7) {
  const s = el.style, b = (1 - p) * blur;
  s.opacity = p.toFixed(4); s.visibility = p < .002 ? 'hidden' : 'visible';
  s.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
  if (base || dy || sc) s.transform = `${base} translateY(${((1 - p) * dy).toFixed(2)}px) scale(${(1 - (1 - p) * sc).toFixed(4)})`;
}
/* press pulse 0→1→0 around a click */
const pulse = (t, tc, hold = .09) => S(t - (tc - .045), 42, 1) - S(t - (tc + hold), 24, .9);
const typed = (t, s, t0, t1) => s.slice(0, Math.floor(clamp((t - t0) / (t1 - t0)) * s.length + 1e-6));

const $ = id => document.getElementById(id);
const hero = $('hero');
const LAY = {};
function layer(key, w, h, cx, cy, html, style = '') {
  const d = document.createElement('div');
  d.className = 'layer'; d.id = 'L_' + key;
  d.style.cssText = `width:${w}px;height:${h}px;margin-left:${-w / 2}px;margin-top:${-h / 2}px;${style}`;
  d.innerHTML = html; hero.appendChild(d);
  LAY[key] = { el: d, w, h, cx, cy };
  return d;
}
/* world anchor of an element inside a layer */
function A(id, fx = .5, fy = .5) {
  let el = $(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && !(el.id && el.id.startsWith('L_'))) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  const L = LAY[el.id.slice(2)];
  return [L.cx - L.w / 2 + x + w * fx, L.cy - L.h / 2 + y + h * fy];
}

/* ───────── seek(t): every style is a pure function of time ───────── */
const px = v => v.toFixed(2) + 'px';
function seek(tIn) {

  hs.transformOrigin = `${px(hw / 2)} ${px(hh / 2)}`;
  hs.transform = `translate(${px(hx - hw / 2)},${px(hy - hh / 2)}) scale(${(1 - pressHero).toFixed(4)})`;
  const c = H.c.map(f => clamp(Math.round(f(t)), 0, 255)), ba = clamp(H.b(t));

  L('bar', [[T.bar + IN, T.shell]]);
  L('shell', [[T.shell + IN, T.agent]]);
  L('agent', [[T.agent + IN, T.cite]]);
  L('src', [[T.cite + IN, T.wf]]);
  L('wf', [[T.wf + IN, T.chat]]);
  L('chat', [[T.chat + IN, T.app]]);
  L('app', [[T.app + IN, T.chan]]);
  L('chan', [[T.chan + IN, T.api]]);
  L('api', [[T.api + IN, T.resolve]]);

    const p = V(t, [[tin, null]]) * (1 - clamp(conv * 1.25));
    const sc = lerp(1, .25, conv);
    el.style.opacity = p.toFixed(4); el.style.visibility = p < .002 ? 'hidden' : 'visible';
    const b = (1 - V(t, [[tin, null]])) * 7; el.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
    el.style.transform = `translate(${px(x)},${px(y)}) translate(-50%,-50%) scale(${(1.32 * sc * (1 - .05 * (1 - V(t, [[tin, null]])))).toFixed(4)})`;
  });

  /* ask bar typing */
  const q1 = 'Put agents to work';
  const tx = typed(t, q1, T.typeA, T.typeB);
  $('barTx').textContent = tx; $('barPh').style.opacity = tx ? 0 : 1;
  const tw = $('barTx').offsetWidth;
  $('barCaret').style.left = px(32 + tw + 2);
  $('barCaret').style.opacity = (t > T.typeA - .3 && (t < T.typeB + .05 || Math.floor((t - T.typeB) / .5) % 2 === 1)) ? 1 : 0;

  /* shell */
  for (let i = 0; i < 4; i++) {
    const ta = T.add[i];
    show($('shEmpty' + i), 1 - S(t - ta, 34, 1), '', 0, 0, 5);
    show($('shFull' + i), V(t, [[ta + .04, null]]), '', 6, .03);
    $('shPlus' + i).style.transform = `scale(${(1 - .12 * pulse(t, ta)).toFixed(4)})`;
    show($('shCh' + i), V(t, [[T.chips[i], null]]), '', 4, .05, 4);
  }
  show($('shStrip'), V(t, [[T.strip, null]]), '', 10, .02);
  const tg = TOG(t), on = S(t - T.tog, 16, 1);
  const k0 = Math.min(tg[0], tg[1] - 20), k1 = Math.max(tg[1], k0 + 20);
  $('shKnob').style.left = px(k0); $('shKnob').style.width = px(k1 - k0);
  $('shTog').style.background = `rgb(${[lerp(196, 13, on), lerp(208, 106, on), lerp(226, 243, on)].map(Math.round)})`;
  $('shTogL').textContent = on > .5 ? 'Connected' : 'Connect'; $('shTogL').style.color = on > .5 ? 'var(--ink)' : 'var(--mute)';

  /* agent */
  const ag = TAB(t); $('agInd').style.left = px(ag[0]); $('agInd').style.width = px(ag[1] - ag[0]);
  const at = t < T.tabK ? 0 : t < T.tabT ? 1 : 2;
  for (let i = 0; i < 3; i++) $('agT' + i).style.color = i === at ? 'var(--ink)' : 'var(--mute)';
  show($('agInstr'), V(t, [[null, T.tabK]]), '', 0, 0, 5);
  show($('agKnow'), V(t, [[T.tabK + IN, T.tabT]]), '', 0, 0, 5);
  show($('agTest'), V(t, [[T.tabT + IN, null]]), '', 0, 0, 5);
  $('agKCount').textContent = t < T.dragR ? '2 sources' : '3 sources';
  const over = S(t - (T.dragR - .25), 30, 1) * (1 - S(t - T.dragR, 30, 1));
  $('agDrop').style.borderColor = `rgba(${over > .5 ? '10,10,10' : '195,210,234'},1)`;
  $('agDrop').style.background = over > .02 ? `rgba(242,245,250,${over})` : 'transparent';
  show($('agDrop'), 1 - S(t - T.dragR, 34, 1), '', 0, 0, 4);
  /* chip: dragged, then becomes the indexed row */
  {
    const p = DRAG.chip(t), land = S(t - T.dragR, 13, .88);
    const w = lerp(240, 712, land), h = 56;
    const el = $('chip');
    const vis = V(t, [[T.chipIn, T.tabT]]);
    show(el, vis, `translate(${px(p[0] - w / 2)},${px(p[1] - h / 2)})`, 0, 0, 6);
    el.style.width = px(w); el.style.height = px(h);
    const held = t >= T.dragP && t < T.dragR ? 1 : 0;
    const lift = S(t - T.dragP, 20, 1) * (1 - S(t - T.dragR, 20, 1));
    $('chipIn').style.transform = `rotate(${(lift * -2).toFixed(3)}deg) scale(${(1 + .03 * lift).toFixed(4)})`;
    $('chipIn').style.boxShadow = `0 1px 2px rgba(16,40,90,.06),0 ${px(10 + 14 * lift)} ${px(28 + 20 * lift)} -8px rgba(16,40,90,${(.14 + .1 * lift).toFixed(3)})`;
    const ip = clamp((t - (T.dragR + .15)) / (T.idx - T.dragR - .15));
    $('chipBar').style.width = (ip * 100).toFixed(1) + '%';
    $('chipTxt').textContent = t < T.idx ? 'Indexing' : 'Indexed · 42 passages';
    $('chipBar').parentNode.style.display = t < T.idx ? 'block' : 'none';
    $('chipStat').style.opacity = clamp(land * 1.4 - .3);
    $('chipMeta').textContent = t < T.dragR ? 'PDF · 1.2 MB' : 'Added just now';
  }
  const qt = typed(t, 'Which payouts breach the T+1 policy?', T.qA, T.qB);
  const sent = t >= T.send;
  $('agTx').textContent = sent ? '' : qt; $('agPh').style.opacity = (qt && !sent) ? 0 : 1;
  $('agSend').style.transform = `scale(${(1 - .12 * pulse(t, T.send)).toFixed(4)})`;
  show($('agQ'), V(t, [[T.send, null]]), '', 14, .04);
  for (let i = 0; i < 3; i++) {
    show($('agS' + i), V(t, [[T.steps[i], null]]), '', 6, 0, 4);
    const done = S(t - (T.steps[i] + BEAT * .9), 26, 1);
    $('agSc' + i).style.transform = `scale(${done.toFixed(4)})`;
    $('agSp' + i).style.transform = `rotate(${(t * 540).toFixed(1)}deg)`; $('agSp' + i).style.opacity = 1 - done;
  }
  show($('agAns'), V(t, [[T.ans, null]]), '', 10, 0, 6);
  $('agCite').style.background = t > T.cite - .25 ? 'var(--fill)' : '#fff';

  /* source highlight */
  const hi = S(t - T.hi, 9, 1);
  $('srcHi').style.width = (hi * 100).toFixed(2) + '%'; $('srcBar').style.opacity = hi;
  $('srcAdd').style.transform = `scale(${(1 - .05 * pulse(t, T.wf)).toFixed(4)})`;

  /* workflow */
  {
    const o = [530, 260]; // layer origin offset in world
    const loc = p => [p[0] + o[0], p[1] + o[1]];
    const n2 = loc(DRAG.n2(t));
    const n2el = $('n2'); n2el.style.left = px(n2[0] - NW / 2); n2el.style.top = px(n2[1] - NH / 2);
    const lift = S(t - T.nP, 20, 1) * (1 - S(t - T.nR, 20, 1));
    n2el.style.boxShadow = `0 1px 2px rgba(16,40,90,.05),0 ${px(16 * lift)} ${px(30 * lift)} -8px rgba(16,40,90,${(.2 * lift).toFixed(3)})`;
    n2el.style.transform = `scale(${(1 + .03 * lift).toFixed(4)})`;
    show($('n1'), 1, '', 0, 0);
    show($('n3'), V(t, [[T.pl2 + .04, null]]), '', 0, .1, 5);
    show($('n6'), V(t, [[T.br, null]]), '', 0, .1, 5);
    show($('n4g'), V(t, [[T.br, T.eR]]), '', 0, .05, 3);
    show($('n4'), V(t, [[T.eR, null]]), '', 0, .06, 4);
    show($('n5'), V(t, [[T.pl4 + .04, null]]), '', 0, .1, 5);
    show($('pl2'), V(t, [[T.nR + .1, T.pl2 + .02]]), `scale(${(1 - .15 * pulse(t, T.pl2)).toFixed(3)})`, 0, .3, 3);
    show($('pl4'), V(t, [[T.eR + .1, T.pl4 + .02]]), `scale(${(1 - .15 * pulse(t, T.pl4)).toFixed(3)})`, 0, .3, 3);
    show($('ly'), V(t, [[T.eR, null]]), '', 0, .1, 3);
    show($('ln'), V(t, [[T.br, null]]), '', 0, .1, 3);
    const n2out = [n2[0] + NW / 2, n2[1]];
    const curve = (a, b) => { const d = Math.max(30, Math.abs(b[0] - a[0]) * .5); return `M${a[0].toFixed(1)} ${a[1].toFixed(1)} C${(a[0] + d).toFixed(1)} ${a[1].toFixed(1)} ${(b[0] - d).toFixed(1)} ${b[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; };
    const E = {
      e12: [[NX[0] + NW, RM + 32], [n2[0] - NW / 2, n2[1]], T.nR],
      e23: [n2out, [NX[2], RM + 32], T.pl2],
      e3n: [[NX[2] + NW, RM + 32], [NX[3], RB + 32], T.br],
      e3y: [[NX[2] + NW, RM + 32], (() => { const p = loc(DRAG.edge(t)); return [p[0], p[1]]; })(), T.eP],
      e45: [[NX[3] + NW, RT + 32], [NX[4], RT + 32], T.pl4],
    };
    for (const [k, [a, b, t0]] of Object.entries(E)) {
      const el = $(k), p = k === 'e3y' ? (t >= T.eP ? 1 : 0) : S(t - t0, 14, 1);
      el.setAttribute('d', curve(a, b)); el.setAttribute('stroke-dasharray', k === 'e3y' ? 'none' : `${p * 400} 400`);
      el.style.opacity = k === 'e3y' ? (t >= T.eP ? 1 : 0) : (p > .001 ? 1 : 0);
      $(k + 'r').setAttribute('d', curve(a, b));
    }
    /* run */
    const seq = [['e12r', T.run + .05, T.r[0]], ['e23r', T.r[0], T.r[1]], ['e3yr', T.r[1], T.r[2]], ['e45r', T.appr, T.r5]];
    let tok = null;
    for (const [id, a, b] of seq) {
      const p = clamp((t - a) / (b - a - .05)), el = $(id);
      const e = p * p * (3 - 2 * p);
      el.setAttribute('stroke-dashoffset', (1 - e).toFixed(4)); el.style.opacity = t > a ? 1 : 0;
      if (t > a && p < 1) { const len = el.getTotalLength(); const pt = el.getPointAtLength(len * e); tok = [pt.x, pt.y]; }
    }
    $('e3nr').style.opacity = 0;
    $('tok').setAttribute('cx', tok ? tok[0] : -50); $('tok').setAttribute('cy', tok ? tok[1] : -50);
    $('tok').style.opacity = tok ? 1 : 0;
    const badge = (id, tb) => { $(id + 'b').style.transform = `scale(${S(t - tb, 22, .8).toFixed(4)})`; };
    badge('n1', T.run + .05); badge('n2', T.r[0]); badge('n3', T.r[1]); badge('n4', T.appr); badge('n5', T.r5); $('n6b').style.transform = 'scale(0)';
    $('n2s').textContent = t >= T.r[0] + .1 ? '3 exceptions flagged' : 'Match against Records';
    $('n5s').textContent = t >= T.r5 + .1 ? 'Ledger updated' : 'ERP · Action';
    const wait = V(t, [[T.r[2], T.appr + .12]]);
    $('n4').style.borderColor = wait > .5 ? 'var(--accent)' : 'var(--line)';
    show($('n4w'), wait, '', -6, 0, 4);
    $('wfAppr').style.transform = `scale(${(1 - .1 * pulse(t, T.appr)).toFixed(4)})`;
    $('wfRun').style.transform = `scale(${(1 - .06 * pulse(t, T.run)).toFixed(4)})`;
    show($('wfSt0'), V(t, [[null, T.run]]), '', 0, 0, 4); show($('wfSt1'), V(t, [[T.run + .06, T.done]]), '', 0, 0, 4); show($('wfSt2'), V(t, [[T.done + .06, null]]), '', 0, 0, 4);
  }

  /* surfaces */
  show($('chQ'), V(t, [[T.chat + BEAT, null]]), '', 12, .04); show($('chA'), V(t, [[T.chat + 2 * BEAT, null]]), '', 10, 0, 6);
  for (let i = 0; i < 3; i++) { show($('apK' + i), V(t, [[T.app + IN + i * BEAT / 4, null]]), '', 8, .02, 5); show($('apR' + i), V(t, [[T.app + BEAT + i * BEAT / 2, null]]), '', 8, 0, 5); }
  show($('cnQ'), V(t, [[T.chan + BEAT, null]]), '', 12, .04); show($('cnA'), V(t, [[T.chan + 2 * BEAT, null]]), '', 10, .03); show($('cnC'), V(t, [[T.chan + 3 * BEAT, null]]), '', 6, 0, 4);
  show($('apiOk'), V(t, [[T.send2, null]]), '', 4, 0, 3);
  APILINES.forEach((l, i) => show($('apiL' + i), V(t, [[T.send2 + (i + 1) * BEAT / 4, null]]), '', 6, 0, 4));
  $('apiSend').style.transform = `scale(${(1 - .08 * pulse(t, T.send2)).toFixed(4)})`;
  /* switcher */
  {
    const p = V(t, [[T.chat + IN, T.resolve]]);
    show($('switch'), p, `translate(${px(-SWW / 2)},${px(SWY)})`, 10, .04, 6);
    const e = SWT(t); $('swInd').style.left = px(e[0]); $('swInd').style.width = px(e[1] - e[0]);
    const act = t < T.app ? 0 : t < T.chan ? 1 : t < T.api ? 2 : 3;
    for (let i = 0; i < 4; i++) $('sw' + i).style.color = i === act ? '#fff' : 'var(--ink2)';
  }
  /* end card */
  {
    const pw = V(t, [[T.word, T.out]]), pt = V(t, [[T.tag, T.out]]);
    show($('endWord'), pw, `translate(${px(END.word[0] - 16 * (1 - pw))},${px(END.word[1])})`, 0, 0, 10);
    show($('endTag'), pt, `translate(${px(-END.tagW / 2)},${px(64)})`, 10, 0, 8);
  }
  /* captions */
  CAPS.forEach((cp, i) => show($('cap' + i), V(t, [[cp[1], cp[2]]]), '', 14, 0, 8));

  /* cursor (screen space, constant size) */
  {
    const w = toScreen(CUR.x(t), CUR.y(t));
    let pr = 0; for (const [a, b] of CUR.PR) pr = Math.max(pr, pulse(t, a, b - a));
    $('cursor').style.transform = `translate(${px(w[0] - 3)},${px(w[1] - 2)}) scale(${(1 - .14 * pr).toFixed(4)})`;
  }
}
window.ready = document.fonts.ready.then(() => { build(); seek(0); window.DUR = DUR; window.seek = seek; return true; });
</script>
</body>
</html>
